[project]
name = "seqc2-toolkit"
version = "0.1.0-dev"
description = "Select, download and prepare SEQC2 somatic reference data (HCC1395/HCC1395BL) for testing workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
seqc2 = "seqc2_toolkit.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seqc2_toolkit = ["sources.yaml", "sources_hg008.yaml", "profiles/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
