# Online full test of workflow-nxf-somatic-variantcomp (-profile test_full): every record
# of the WGS and WES MuTect2 VCFs of IL_1 and the whole GRCh38.d1.vd1 reference (3.2 GB),
# read by the pipeline from the SEQC2 server.
name: variantcomp_test_full  # dataset name (default: the file name)
access: remote
select:
  technologies: [WGS, WES]
  pairs: [IL_1]
data:
  # the WES target BED is written into the dataset folder (BED3, merged, gzip; the
  # remote file is a BED6 named *.bed6.gz, which the pipeline doesn't accept): the only
  # local file; VCFs and reference are read online
  target_bed: local
  truth: v1.2.1
