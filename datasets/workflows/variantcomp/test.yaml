# Online smoke test of workflow-nxf-somatic-variantcomp (-profile test): WGS and WES of
# IL_1 (one pseudo-sample, two technologies), MuTect2 VCFs read by the pipeline from the
# SEQC2 server, GRCh38 chr21 FASTA from nf-core/test-datasets; the pipeline drops the
# records of the other contigs. No BAMs, no annotation resources; the WES target BED is a local file.
name: variantcomp_test  # dataset name (default: the file name)
access: remote
select:
  technologies: [WGS, WES]
  pairs: [IL_1]
data:
  # the WES target BED is written into the dataset folder (BED3, merged, gzip; the
  # remote file is a BED6 named *.bed6.gz, which the pipeline doesn't accept): the only
  # local file; VCFs and reference are read online
  target_bed: local
  truth: v1.2.1
subset:
  contigs: [chr21]
