# cio-abcd/variantinterpretation: annotation (Ensembl VEP), filtering, TSV/HTML reports and
# TMB of VCFs. One samplesheet row per VCF. The VEP cache is not SEQC2 data: give it with
# --vep_cache (and --vep_cache_version, 115 for v1.2.0) on the run command line or in an
# extra config (-c).
name: variantinterpretation
description: annotate and report somatic VCFs with Ensembl VEP and datavzrd (cio-abcd)
pipeline: cio-abcd/variantinterpretation
revision: v1.2.0
nf_profile: conda
accepts:
  # allele fractions are read from FORMAT/AD (--allele_fraction FORMAT_AD)
  callers: [muTect2]
requires: [vcf, reference]
paths: absolute
samplesheet:
  file: samplesheet.csv
  rows: vcf
  columns:
    sample: "{source_name}_{pair}_{tech}_{aligner}_{caller}"
    vcf: "{vcf}"
    group: "{source_name}_{pair}"
params:
  input: "{samplesheet}"
  fasta: "{reference}"
params_remote:
  # remote datasets: the SEQC2 VCFs are plain gzip; the pipeline recompresses them to BGZF
  # before indexing (param of the pipeline since feat-seqc2-tests, default false)
  recompress_vcf: true
